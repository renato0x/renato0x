<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Renato Monteiro</title>
  <desc id="desc">Software developer working across web, desktop, and automation</desc>

  <style>
    .name,
    .role {
      opacity: 0;
      transform: translateY(6px);
      animation: reveal 700ms cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .name { animation-delay: 120ms; }
    .role { animation-delay: 280ms; }

    .accent {
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: draw 1200ms cubic-bezier(.16, 1, .3, 1) 360ms forwards;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .name,
      .role {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .accent {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect x="0.5" y="0.5" width="719" height="179" rx="10" fill="#0D1117" stroke="#30363D" />

  <g text-anchor="middle">
    <text
      class="name"
      x="360"
      y="83"
      fill="#F0F6FC"
      font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="40"
      font-weight="650"
      letter-spacing="1.5"
    >RENATO MONTEIRO</text>

    <text
      class="role"
      x="360"
      y="118"
      fill="#B1BAC4"
      font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="17"
      font-weight="400"
      letter-spacing="1"
    >software developer · web · desktop · automation</text>
  </g>

  <path d="M280 143H440" stroke="#30363D" stroke-width="2" stroke-linecap="round" />
  <path class="accent" d="M280 143H440" stroke="#3FB950" stroke-width="2" stroke-linecap="round" />
</svg>
